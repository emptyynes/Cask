name: Nix

# Checks the Nix packaging (flake.nix, nix/). Does not touch the main build workflow.
on:
  push:
    branches: [nixos]
    paths: ['flake.nix', 'flake.lock', 'nix/**', '.github/workflows/nix.yml']
  pull_request:
    paths: ['flake.nix', 'flake.lock', 'nix/**', '.github/workflows/nix.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nix:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # Sources for the dev shell test (this branch has only the Nix files).
      - uses: actions/checkout@v4
        with:
          ref: main
          path: main-src

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}

      # flake.lock pins nixpkgs; create it if it is not committed yet.
      - name: Lock inputs
        run: nix flake lock

      - name: Flake check
        run: nix flake check --print-build-logs

      - name: Build the package
        run: nix build .#default --print-build-logs --no-link --print-out-paths

      - name: Smoke test (offscreen)
        run: |
          out=$(nix build .#default --no-link --print-out-paths)
          export HOME=$RUNNER_TEMP/home
          mkdir -p "$HOME"
          status=0
          QT_QPA_PLATFORM=offscreen timeout 5 "$out/bin/cask" || status=$?
          [ "$status" -eq 124 ] || { echo "Smoke test failed (exit code $status)"; exit 1; }
          # The launcher must have created Cask's root in the user's data dir, not in the read-only store.
          test -f "$HOME/.local/share/cask/cask.ini" || ls -la "$HOME/.local/share/cask" || true
          test -d "$HOME/.local/share/cask/prefixes"

      - name: Build the FHS variant
        run: nix build .#cask-fhs --print-build-logs --no-link

      - name: Dev shell
        run: nix develop "$PWD" --command bash -c 'cd main-src && cmake -S . -B /tmp/b -G Ninja && cmake --build /tmp/b'

      # Evaluate a NixOS configuration that uses the module with its options.
      - name: NixOS module
        run: |
          nix eval --impure --raw --expr '
            let
              flake = builtins.getFlake (toString ./.);
              system = flake.inputs.nixpkgs.lib.nixosSystem {
                system = "x86_64-linux";
                modules = [
                  flake.nixosModules.default
                  ({ pkgs, ... }: {
                    programs.cask = {
                      enable = true;
                      fhs = true;
                      gamemode = true;
                      dataDir = "$HOME/Games/Cask";
                      wine = pkgs.wineWowPackages.staging;
                      extraPackages = [ pkgs.zenity ];
                    };
                    fileSystems."/" = { device = "none"; fsType = "tmpfs"; };
                    boot.loader.grub.enable = false;
                    system.stateVersion = "25.05";
                  })
                ];
              };
            in
            system.config.system.build.toplevel.drvPath'

      - name: Print flake.lock
        run: cat flake.lock
