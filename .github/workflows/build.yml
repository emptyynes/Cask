name: Build

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # needed only to publish a release on a tag

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build qt6-base-dev libgl1-mesa-dev patchelf

      - name: Check translations
        run: python3 scripts/check-translations.py

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      - name: Unit tests
        run: QT_QPA_PLATFORM=offscreen ctest --test-dir build --output-on-failure

      - name: Bundle portable layout
        run: bash scripts/bundle-linux.sh build/Cask

      - name: Smoke test (offscreen)
        run: |
          set +e
          # 124 = process was alive until the timeout, i.e. the window started successfully
          QT_QPA_PLATFORM=offscreen timeout 3 build/Cask/cask
          test "$?" -eq 124 || { echo "English smoke test failed"; exit 1; }
          # same with a Russian system locale (the UI is built from the translation)
          LANG=ru_RU.UTF-8 LC_ALL=ru_RU.UTF-8 QT_QPA_PLATFORM=offscreen timeout 3 build/Cask/cask
          test "$?" -eq 124

      - name: Archive
        run: tar -C build -czf Cask-linux-x86_64.tar.gz Cask

      - uses: actions/upload-artifact@v4
        with:
          name: Cask-linux-x86_64
          path: Cask-linux-x86_64.tar.gz

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Cask-linux-x86_64.tar.gz
