name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# Cancel superseded runs of the same branch, but never a tag build that publishes a release.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build qt6-base-dev libgl1-mesa-dev patchelf

      - name: Check translations
        run: python3 scripts/check-translations.py

      # Version for "About": the tag without "v" for a release, otherwise the short commit hash.
      - name: Configure
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then version="${GITHUB_REF_NAME#v}"; else version="${GITHUB_SHA::7}"; fi
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCASK_VERSION="$version"

      - name: Build
        run: cmake --build build

      - name: Bundle portable layout
        run: bash scripts/bundle-linux.sh build/Cask

      # Exit code 124 means the process was still alive when the timeout hit, i.e. the window started.
      - name: Smoke test (offscreen)
        run: |
          status=0
          QT_QPA_PLATFORM=offscreen timeout 3 build/Cask/cask || status=$?
          [ "$status" -eq 124 ] || { echo "Smoke test failed (exit code $status)"; exit 1; }

      - name: Archive
        run: tar -C build -czf Cask-linux-x86_64.tar.gz Cask

      - uses: actions/upload-artifact@v4
        with:
          name: Cask-linux-x86_64
          path: Cask-linux-x86_64.tar.gz

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: linux
    runs-on: ubuntu-24.04
    permissions:
      contents: write   # needed only to publish the release
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Cask-linux-x86_64

      - uses: softprops/action-gh-release@v2
        with:
          files: Cask-linux-x86_64.tar.gz
          generate_release_notes: true

  # After a release, point the `nixos` branch (Nix packaging) at the new tag.
  nix-branch:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write   # pushes to the nixos branch
    steps:
      - uses: actions/checkout@v4
        with:
          ref: nixos

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}

      - name: Point the flake at the release
        run: |
          tag="$GITHUB_REF_NAME"
          sed -i "s|github:ndiruhniu/cask/[^\"]*|github:ndiruhniu/cask/${tag}|" flake.nix
          grep -n "cask-src" -A1 flake.nix | head -4
          printf '{\n  "version": "%s",\n  "rev": "%s"\n}\n' "${tag#v}" "$GITHUB_SHA" > nix/release.json
          nix flake update cask-src

      - name: Check the build
        run: nix build .#default --print-build-logs --no-link

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flake.nix flake.lock nix/release.json
          git commit -m "nix: update to ${GITHUB_REF_NAME}" || exit 0
          git push origin HEAD:nixos
